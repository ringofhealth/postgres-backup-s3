name: test, build, and publish images

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Lint scripts
        run: make lint
      - name: Run unit tests
        run: make test

  integration:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    steps:
      - uses: actions/checkout@v4
      - name: Encrypted backup and restore round trip
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: make integration

  publish:
    if: github.event_name == 'push'
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish PostgreSQL ${{ matrix.postgres }} client image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres }}
          tags: |
            ${{ github.repository }}:${{ matrix.postgres }}
            ghcr.io/${{ github.repository }}:${{ matrix.postgres }}
          cache-from: type=gha,scope=postgres-${{ matrix.postgres }}
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.postgres }}
