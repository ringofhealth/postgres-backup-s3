name: postgres-backup-s3-test-${POSTGRES_VERSION:-18}

services:
  source:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: source
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm)\" = postgres ] && pg_isready -U postgres -d source"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${TEST_DATA_ROOT:?integration script sets TEST_DATA_ROOT}/source:/var/lib/postgresql

  target:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm)\" = postgres ] && pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${TEST_DATA_ROOT:?integration script sets TEST_DATA_ROOT}/target:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    volumes:
      - ${TEST_DATA_ROOT:?integration script sets TEST_DATA_ROOT}/minio:/data

  backup:
    build:
      context: .
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18}
    environment:
      POSTGRES_HOST: source
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: source
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: integration-backups
      S3_PREFIX: test/postgres
      S3_ACCESS_KEY_ID: test-access-key
      S3_SECRET_ACCESS_KEY: test-secret-key
      PASSPHRASE: integration-passphrase
      BACKUP_MODE: stream
      BACKUP_VERIFY_MODE: checksum
      BACKUP_KEEP_MINIMUM: 1
      PGDUMP_EXTRA_OPTS: --no-owner --no-privileges
    depends_on:
      source:
        condition: service_healthy
      target:
        condition: service_healthy
      minio:
        condition: service_started
