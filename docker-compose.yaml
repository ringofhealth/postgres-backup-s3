services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm)\" = postgres ] && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backup:
    build:
      context: .
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18}
    restart: unless-stopped
    environment:
      SCHEDULE: ${SCHEDULE:-17 3 * * *}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-no}
      BACKUP_MODE: ${BACKUP_MODE:-stream}
      BACKUP_VERIFY_MODE: ${BACKUP_VERIFY_MODE:-checksum}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_MINIMUM: ${BACKUP_KEEP_MINIMUM:-3}
      PASSPHRASE_FILE: /run/secrets/backup_passphrase
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      # Use '-' rather than ':-' so an explicitly empty value targets the
      # bucket root while an unset value retains the safe default.
      S3_PREFIX: ${S3_PREFIX-postgres}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDUMP_EXTRA_OPTS: ${PGDUMP_EXTRA_OPTS:---no-owner --no-privileges}
    secrets:
      - postgres_password
      - backup_passphrase
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - backup_state:/state
      - backup_work:/work
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  backup_passphrase:
    file: ${PASSPHRASE_FILE:-./secrets/backup_passphrase}
  s3_access_key_id:
    file: ${S3_ACCESS_KEY_ID_FILE:-./secrets/s3_access_key_id}
  s3_secret_access_key:
    file: ${S3_SECRET_ACCESS_KEY_FILE:-./secrets/s3_secret_access_key}

volumes:
  postgres_data:
  backup_state:
  backup_work:
